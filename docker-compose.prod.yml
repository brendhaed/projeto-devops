services:
  backend:
    image: ghcr.io/brendhaed/projeto-devops-backend:latest
    container_name: series-backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      SERIES_DATA_FILE: /app/data/series.json
    volumes:
      - series-data:/app/data

  frontend:
    image: ghcr.io/brendhaed/projeto-devops-frontend:latest
    container_name: series-frontend
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: series-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  series-data: